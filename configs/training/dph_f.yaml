extends:
- ../defaults/bird.yaml
method: dph_f
training:
  replay_per_iteration: 128
method_options:
  forward_weight: 0.01
  presample_rollouts: 8
  preservation_threshold: 8
  max_resample_groups: 64
  dynamic_sampling: false
offline:
  generation_batch_size: 64
  verifier_workers: 16
runtime:
  batch_timeout_seconds: 21600
  max_checkpoints_to_keep: 2
